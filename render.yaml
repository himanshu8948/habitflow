services:
  - type: web
    name: habitflow
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: habitflow-db
          property: connectionString

databases:
  - name: habitflow-db
    plan: free
